server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/musicdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      static-locations: classpath:/static/,file:../frontend/

# AI music generation - Replicate (musicgen) by default.
# Fill in your token and the website will use real AI to generate music.
# If empty or call fails, the system falls back to a real curated track.
ai:
  provider: replicate
  replicate:
    api-token: ${REPLICATE_API_TOKEN:}
    model-version: 7be0f12c54a8d033a0fbd14418c9af98962da9a86f5ff7811f9b3423a1f0b7d7
    base-url: https://api.replicate.com/v1
  fallback:
    # Real, free demo audio tracks from SoundHelix - safe for demo use
    audio-urls:
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3
      - https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3

logging:
  level:
    com.musicsite: INFO
    org.hibernate.SQL: WARN
